name: Studio – Kanal-Check

# Prüft jeden Morgen alle Kanäle aus channels/channels.json:
# Token gültig? Richtiger Kanal? Abos/Videos/Views + letzte Uploads -> channels/status.md
on:
  push:
    branches: [main]
    paths:
      - 'channels/channels.json'
      - 'autopilot/studio.py'
      - '.github/workflows/studio.yml'
  schedule:
    - cron: '45 5 * * *'   # 06:45 Berlin (Winterzeit)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: studio
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python-Pakete
        run: pip install -q google-api-python-client google-auth-oauthlib

      - name: Alle Kanäle prüfen
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          WT_GOOGLE_REFRESH_TOKEN: ${{ secrets.WT_GOOGLE_REFRESH_TOKEN }}
          YT_TOKENS_JSON: ${{ secrets.YT_TOKENS_JSON }}
        run: python autopilot/studio.py check

      - name: Status ins Repository
        run: |
          git config user.name "studio-bot"
          git config user.email "autopilot@users.noreply.github.com"
          git add channels/status.md channels/status.json
          git commit -m "Studio-Check: $(date -u +%F)" || { echo "nichts zu speichern"; exit 0; }
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            git pull --rebase -X theirs origin main || { git rebase --abort 2>/dev/null; git pull --no-rebase -X ours --no-edit origin main; }
            sleep $((i * 5))
          done
          echo "::error::Push fehlgeschlagen"
          exit 1
