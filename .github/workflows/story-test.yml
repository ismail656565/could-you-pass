name: Story Test (True Story Short)
on:
  workflow_dispatch: {}
  push:
    branches: [hypit-test]
    paths: ['story-test/**', '.github/workflows/story-test.yml']
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HYPIT_SHA: e26d9142fd8a6f78bf4f3cdb800d6205f4ecca16
      P: examples/cyp-story
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: mkdir -p out && (command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg))
      - name: Stimme (Kokoro)
        run: |
          pip install -q kokoro-onnx soundfile
          mkdir -p models
          curl -sSL -o models/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          curl -sSL -o models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
          python story-test/narrate.py story-test/lines.json models out 2>&1 | tee out/narrate.log
      - name: Hypit holen
        run: |
          git clone -q https://github.com/hypit-ai/hypit.git hypit
          git -C hypit checkout -q "$HYPIT_SHA"
          mkdir -p "hypit/$P"
          cp -r story-test/packages story-test/story.svs story-test/story.svrun story-test/hypit.runtime.json "hypit/$P/"
          node story-test/make-svml.mjs story-test/lines.json out/timings.json "hypit/$P/story.svml"
          cp "hypit/$P/story.svml" out/
      - name: Installieren und bauen
        working-directory: hypit
        run: |
          pnpm install --no-frozen-lockfile
          pnpm build:public-types
          pnpm --filter @cyp/story-scene build 2>&1 | tee ../out/tsc.log; exit ${PIPESTATUS[0]}
      - name: Quelle prüfen
        working-directory: hypit
        run: node bin/hypit.mjs check "$P/story.svml" --project "$P" 2>&1 | tee ../out/check.log; exit ${PIPESTATUS[0]}
      - name: Browser vorbereiten
        working-directory: hypit
        run: node bin/hypit.mjs programs up --project "$P" --runtime "$P/hypit.runtime.json" --endpoint html.local 2>&1 | tee ../out/programs.log; exit ${PIPESTATUS[0]}
      - name: Rendern
        working-directory: hypit
        run: |
          node bin/hypit.mjs build "$P/story.svrun" --project "$P" --runtime "$P/hypit.runtime.json" --follow 2>&1 | tee ../out/build.log
          id=$(grep -oE '\bb[a-z]*[_-][A-Za-z0-9_-]{6,}|build[_-][A-Za-z0-9_-]+' ../out/build.log | head -1 || true)
          if [ -n "$id" ] && node bin/hypit.mjs get "$id" --output final.video --to ../out/silent.mp4 --project "$P" --runtime "$P/hypit.runtime.json"; then echo ok
          else f=$(find "$P/.hypit" -name '*.mp4' -size +100k -printf '%T@ %p\n' 2>/dev/null | sort -n | tail -1 | cut -d' ' -f2-); [ -n "$f" ] && cp "$f" ../out/silent.mp4; fi
      - name: Ton mischen
        run: bash story-test/mix.sh out/silent.mp4 out/narration.wav out/timings.json public/sfx out/true-story-test.mp4
      - name: Ergebnis in Branch story-out legen
        if: always()
        run: |
          rm -f out/silent.mp4 out/narration.wav
          cd out && git init -q && git checkout -q -b story-out
          git config user.name "story-test" && git config user.email "autopilot@users.noreply.github.com"
          git add -A && git commit -qm "Story-Test Ergebnis ${GITHUB_RUN_ID}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" story-out
