name: Studio – Zahlen + Konkurrenz

# Holt täglich die Zahlen aller eigenen Kanäle und scannt die Konkurrenz (studio/analytics/competitors.json).
# Ergebnis: studio/analytics/*.md/*.json im Repo; Thumbnails/Frames/Transkripte der Konkurrenz nur als Artefakt.
on:
  schedule:
    - cron: '7 16 * * *'    # 17:07 Berlin – vor dem Kanal-Manager
    - cron: '37 4 * * *'    # 05:37 Berlin – frische Zahlen am Morgen
  workflow_dispatch:
    inputs:
      what:
        description: 'stats | competitors | all'
        default: 'all'

permissions:
  contents: write

concurrency:
  group: studio-intel
  cancel-in-progress: false

jobs:
  intel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pakete
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q google-api-python-client google-auth-oauthlib yt-dlp
      - name: Zahlen + Konkurrenz
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          WT_GOOGLE_REFRESH_TOKEN: ${{ secrets.WT_GOOGLE_REFRESH_TOKEN }}
          YT_TOKENS_JSON: ${{ secrets.YT_TOKENS_JSON }}
        run: python autopilot/intel.py ${{ github.event.inputs.what || 'all' }}
      - name: Medien als Artefakt (nicht im Repo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intel-media
          path: intel_media/
          retention-days: 7
          if-no-files-found: ignore
      - name: Ins Repository
        run: |
          git config user.name "studio-bot"
          git config user.email "autopilot@users.noreply.github.com"
          git add studio/analytics/
          git commit -m "Intel: $(date -u +%F)" || { echo "nichts zu speichern"; exit 0; }
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            git pull --rebase -X theirs origin main || { git rebase --abort 2>/dev/null; git pull --no-rebase -X ours --no-edit origin main; }
            sleep $((i * 5))
          done
          exit 1
