name: Money Render

on:
  push:
    branches: [money-scale]
    paths:
      - 'money/**'
      - '.github/workflows/money-render.yml'

permissions:
  contents: write

concurrency:
  group: money-render
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: true
      matrix:
        part: [0, 1, 2, 3]
    defaults:
      run:
        working-directory: money
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: System packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg jq

      - name: Install
        run: |
          npm install --no-audit --no-fund
          npx remotion browser ensure

      - name: CC0 assets (Poly Haven)
        uses: actions/cache@v4
        with:
          path: money/public/env
          key: polyhaven-env-v2

      - name: Fetch assets
        run: bash scripts/fetch-assets.sh

      - name: Bundle
        run: npx remotion bundle src/index.ts --out-dir build 2>&1 | tail -5

      - name: Render part ${{ matrix.part }}
        run: |
          mkdir -p out
          TOTAL=$(node -e "console.log(34*30)")
          PARTS=4
          P=${{ matrix.part }}
          A=$(( TOTAL * P / PARTS ))
          B=$(( TOTAL * (P + 1) / PARTS - 1 ))
          START=$(date +%s)
          MODE=$(jq -r .mode render.json)
          if [ "$MODE" = "stills" ]; then
            if [ "$P" = "0" ]; then
              for F in $(jq -r '.frames[]' render.json); do
                npx remotion still build MoneyShort out/f$(printf %04d $F).png --frame=$F --gl=swangle --timeout=180000 --log=error || true
              done
            fi
            touch out/part$P.mp4 out/timing$P.txt out/render$P.log
            exit 0
          fi
          npx remotion render build MoneyShort out/part$P.mp4 --gl=swangle --concurrency=2 --timeout=180000 \
            --frames=$A-$B --muted --crf=16 > out/render$P.log 2>&1 || { echo "RENDER FAILED"; tail -30 out/render$P.log; exit 1; }
          echo "part $P frames $A-$B seconds $(( $(date +%s) - START ))" | tee out/timing$P.txt

      - uses: actions/upload-artifact@v4
        with:
          name: part${{ matrix.part }}
          path: |
            money/out/*.png
            money/out/part${{ matrix.part }}.mp4
            money/out/timing${{ matrix.part }}.txt
            money/out/render${{ matrix.part }}.log
          retention-days: 3

  assemble:
    needs: render
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - uses: actions/download-artifact@v4
        with:
          path: parts
          merge-multiple: true
      - name: Join parts, add music, loudness-normalise
        run: |
          mkdir -p out
          ls -la parts
          cp parts/*.png out/ 2>/dev/null || true
          if [ $(find parts -name 'part*.mp4' -size +1k | wc -l) -eq 4 ]; then
            for i in 0 1 2 3; do echo "file '$PWD/parts/part$i.mp4'" ; done > list.txt
            ffmpeg -hide_banner -loglevel error -y -f concat -safe 0 -i list.txt -c copy video.mp4
            ffmpeg -hide_banner -loglevel error -y -i video.mp4 -i money/public/music/cutscene-crush.mp3 \
              -filter_complex "[1:a]atrim=0:34,afade=t=in:d=0.2,afade=t=out:st=32.6:d=1.4,loudnorm=I=-14:TP=-1.5:LRA=11[a]" \
              -map 0:v -map "[a]" -c:v libx264 -preset slow -crf 21 -pix_fmt yuv420p -c:a aac -b:a 192k -movflags +faststart -shortest out/money_final.mp4
            ffmpeg -hide_banner -loglevel error -y -i out/money_final.mp4 -vf "fps=1/2.5,scale=270:480,tile=7x2" -frames:v 1 out/sheet.jpg
          fi
          cp parts/*.txt parts/*.log out/ 2>/dev/null || true
          ls -la out
      - name: Publish results to branch money-out
        run: |
          cd out
          git init -q -b money-out
          git config user.name "money-render"
          git config user.email "money-render@users.noreply.github.com"
          echo "${GITHUB_SHA}" > source-sha.txt
          git add -A
          git commit -qm "render ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" money-out
