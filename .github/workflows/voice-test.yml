name: Voice Test (Kokoro)
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -q kokoro-onnx soundfile
      - name: Modell laden
        run: |
          mkdir -p models
          curl -sSL -o models/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          curl -sSL -o models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
      - run: python autopilot/voice_test.py models
      - run: |
          git config user.name "quiz-autopilot"
          git config user.email "autopilot@users.noreply.github.com"
          git add autopilot/voice-samples
          git commit -m "Kokoro-Hörproben" || true
          git pull --rebase -q || true
          git push || true
