name: Quiz Autopilot

on:
  schedule:
    # Hauptlauf: rendert + lädt hoch, YouTube veröffentlicht geplant (Short 10:00, langes Video 14:00 deutsche Zeit)
    - cron: '15 7 * * *'   # 09:15 Sommerzeit / 08:15 Winterzeit
    - cron: '0 11 * * *'   # Ersatzlauf, falls morgens noch nichts in der Warteschlange war
    # nur Erst-Kommentare posten, sobald die Videos öffentlich sind
    - cron: '10 8 * * *'
    - cron: '10 9 * * *'
    - cron: '10 12 * * *'
    - cron: '10 13 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'all | dryrun | comments | playlists | analytics | private | outliers'
        required: false
        default: 'all'
      args:
        description: 'zusätzliche Angaben, z. B. Video-IDs für mode=private'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: autopilot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      MODE: ${{ github.event.inputs.mode || ((github.event.schedule == '15 7 * * *' || github.event.schedule == '0 11 * * *') && 'all' || 'comments') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Neuesten Stand holen (wichtig, wenn dieser Lauf gewartet hat)
        run: git pull --ff-only origin main

      - uses: actions/setup-node@v4
        if: env.MODE != 'comments' && env.MODE != 'outliers'
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: System-Pakete (ffmpeg, Emoji-Schrift)
        if: env.MODE != 'comments' && env.MODE != 'outliers'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji fonts-noto-core
          fc-cache -f

      - name: Abhängigkeiten
        if: env.MODE != 'comments' && env.MODE != 'outliers'
        run: |
          npm ci
          npx remotion browser ensure

      - name: Python-Pakete
        run: |
          pip install -q google-api-python-client google-auth-oauthlib requests numpy imageio-ffmpeg
          if [ "$MODE" != "comments" ] && [ "$MODE" != "outliers" ]; then pip install -q kokoro-onnx soundfile; fi

      - name: Kokoro-Stimmenmodell (Cache)
        if: env.MODE != 'comments' && env.MODE != 'outliers'
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0

      - name: Kokoro-Stimmenmodell laden
        if: env.MODE != 'comments' && env.MODE != 'outliers'
        run: |
          mkdir -p models
          [ -f models/kokoro-v1.0.onnx ] || curl -sSL -o models/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          [ -f models/voices-v1.0.bin ] || curl -sSL -o models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
          ls -la models

      - name: Analytics + Video produzieren + hochladen
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          PRIVACY: ${{ vars.PRIVACY || 'public' }}
          RENDER_CONCURRENCY: '100%'
        run: python autopilot/autopilot.py $MODE ${{ github.event.inputs.args }}

      - name: Fertiges Video zum Ansehen speichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos
          path: out/*.mp4
          if-no-files-found: ignore
          retention-days: 14

      - name: Ergebnisse zurück ins Repository
        if: always()
        run: |
          git config user.name "quiz-autopilot"
          git config user.email "autopilot@users.noreply.github.com"
          git add autopilot stories public/audio
          git commit -m "Autopilot ($MODE): $(date -u +%F)" || echo "nichts zu speichern"
          git pull --rebase -q || true
          git push || true
