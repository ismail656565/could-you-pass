name: Quiz Autopilot

on:
  schedule:
    # Hauptlauf: rendert + lädt hoch, YouTube veröffentlicht geplant (Short 10:00, langes Video 14:00 deutsche Zeit)
    - cron: '15 7 * * *'   # 09:15 Sommerzeit / 08:15 Winterzeit
    - cron: '0 11 * * *'   # Ersatzlauf, falls morgens noch nichts in der Warteschlange war
    # nur Erst-Kommentare posten, sobald die Videos öffentlich sind
    - cron: '10 8 * * *'
    - cron: '10 9 * * *'
    - cron: '10 12 * * *'
    - cron: '10 13 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: autopilot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MODE: ${{ (github.event.schedule == '15 7 * * *' || github.event.schedule == '0 11 * * *' || github.event_name != 'schedule') && 'all' || 'comments' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: env.MODE == 'all'
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: System-Pakete (ffmpeg, Emoji-Schrift)
        if: env.MODE == 'all'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji fonts-noto-core
          fc-cache -f

      - name: Abhängigkeiten
        if: env.MODE == 'all'
        run: |
          npm ci
          npx remotion browser ensure

      - name: Python-Pakete
        run: |
          pip install -q google-api-python-client google-auth-oauthlib requests numpy imageio-ffmpeg

      - name: Analytics + Video produzieren + hochladen
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          PRIVACY: ${{ vars.PRIVACY || 'public' }}
        run: python autopilot/autopilot.py $MODE

      - name: Fertiges Video zum Ansehen speichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos
          path: out/*.mp4
          if-no-files-found: ignore
          retention-days: 14

      - name: Ergebnisse zurück ins Repository
        if: always()
        run: |
          git config user.name "quiz-autopilot"
          git config user.email "autopilot@users.noreply.github.com"
          git add autopilot stories public/audio
          git commit -m "Autopilot ($MODE): $(date -u +%F)" || echo "nichts zu speichern"
          git pull --rebase -q || true
          git push || true
