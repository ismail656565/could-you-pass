name: Studio – Kanäle produzieren

# Jeden Tag: pro Kanal die nächsten Shorts malen, vertonen, rendern und geplant hochladen.
# Welche Kanäle laufen und wann veröffentlicht wird: studio/channels/<kanal>/channel.json
on:
  schedule:
    - cron: '30 4 * * *'   # 05:30 Berlin (Winterzeit) – Videos gehen um 13:00 und 19:30 online
  workflow_dispatch:
    inputs:
      channel:
        description: 'Kanal-ID (leer = alle aktiven Kanäle)'
        required: false
        default: ''
      shorts:
        description: 'Anzahl Shorts (leer = wie in channel.json)'
        required: false
        default: ''
      dry:
        description: 'nur rendern, nicht hochladen (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: studio-produce
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      channels: ${{ steps.c.outputs.channels }}
    steps:
      - uses: actions/checkout@v4
      - id: c
        run: |
          if [ -n "${{ github.event.inputs.channel }}" ]; then
            echo "channels=[\"${{ github.event.inputs.channel }}\"]" >> $GITHUB_OUTPUT
          else
            echo "channels=$(python3 -c 'import json,pathlib;print(json.dumps([p.parent.name for p in sorted(pathlib.Path("studio/channels").glob("*/channel.json")) if json.loads(p.read_text()).get("enabled",True)]))')" >> $GITHUB_OUTPUT
          fi

  produce:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        channel: ${{ fromJson(needs.plan.outputs.channels) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: studio/requirements.txt

      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null

      - name: Python-Pakete
        run: pip install -q -r studio/requirements.txt

      - name: Stimme + Wort-Timing (Modelle zwischenspeichern)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/kokoro
            ~/.cache/huggingface
          key: studio-models-v1

      - name: Produzieren + hochladen
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YT_TOKENS_JSON: ${{ secrets.YT_TOKENS_JSON }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          WT_GOOGLE_REFRESH_TOKEN: ${{ secrets.WT_GOOGLE_REFRESH_TOKEN }}
        run: |
          ARGS=""
          [ -n "${{ github.event.inputs.shorts }}" ] && ARGS="$ARGS --shorts ${{ github.event.inputs.shorts }}"
          [ "${{ github.event.inputs.dry }}" = "true" ] && ARGS="$ARGS --dry"
          python studio/produce.py ${{ matrix.channel }} $ARGS

      - name: Wöchentliches langes Video (nur am eingestellten Wochentag)
        if: github.event.inputs.dry != 'true'
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YT_TOKENS_JSON: ${{ secrets.YT_TOKENS_JSON }}
        run: python studio/long.py ${{ matrix.channel }}

      - name: Vorschau behalten (Probelauf)
        if: github.event.inputs.dry == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: preview-${{ matrix.channel }}
          path: /tmp/studio/**/final.mp4
          retention-days: 7

      - name: Stand speichern
        if: always()
        run: |
          git config user.name "studio-bot"
          git config user.email "autopilot@users.noreply.github.com"
          git add studio/channels/${{ matrix.channel }}/state.json 2>/dev/null || true
          git commit -m "Studio ${{ matrix.channel }}: $(date -u +%F)" || { echo "nichts zu speichern"; exit 0; }
          for i in 1 2 3 4 5 6; do
            if git push; then exit 0; fi
            git pull --rebase origin main || { git rebase --abort 2>/dev/null; git pull --no-rebase --no-edit origin main; }
            sleep $((i * 7))
          done
          echo "::error::Push fehlgeschlagen"
          exit 1
